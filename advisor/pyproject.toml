[project]
name = "ru-course-sniper-advisor"
version = "0.1.0"
description = "Academic advisor agent for RU Course Sniper: catalog, degree audit, planner"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13.0,<2.0",
    "requests>=2.32.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.6",
    "mypy>=1.10.0,<2.0",
    "bandit>=1.7.0,<2.0",
    "pip-audit>=2.7.0,<3.0",
    "types-requests>=2.32.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["advisor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["advisor"]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
