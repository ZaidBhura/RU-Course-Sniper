[project]
name = "ru-course-sniper-backend"
version = "0.1.0"
description = "RU Course Sniper — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0,<0.112",
    "uvicorn[standard]>=0.30.0,<0.31",
    "sqlalchemy>=2.0.30,<2.1",
    "asyncpg>=0.29.0,<0.30",
    "alembic>=1.13.0,<2.0",
    "pydantic>=2.7.0,<3.0",
    "pydantic-settings>=2.3.0,<3.0",
    "cryptography>=42.0.0,<43.0",
    "redis>=5.0.0,<6.0",
    "python-dotenv>=1.0.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "anyio>=4.4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
