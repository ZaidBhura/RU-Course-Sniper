[project]
name = "ru-course-sniper-backend"
version = "0.1.0"
description = "RU Course Sniper — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0,<0.112",
    "uvicorn[standard]>=0.30.0,<0.31",
    "sqlalchemy>=2.0.30,<2.1",
    "asyncpg>=0.29.0,<0.30",
    "psycopg2-binary>=2.9.9,<3.0",
    "alembic>=1.13.0,<2.0",
    "pydantic>=2.7.0,<3.0",
    "pydantic-settings>=2.3.0,<3.0",
    "cryptography>=42.0.0,<43.0",
    "redis>=5.0.0,<6.0",
    "celery[redis]>=5.4.0,<6.0",
    "requests>=2.32.0,<3.0",
    "python-dotenv>=1.0.0,<2.0",
    "python-jose[cryptography]>=3.3.0,<4.0",
    "argon2-cffi>=23.1.0,<24.0",
    "slowapi>=0.1.9,<0.2",
    "email-validator>=2.1.0,<3.0",
    "structlog>=24.0.0,<26.0",
    "sentry-sdk[fastapi]>=2.0.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "fakeredis>=2.23.0",
    "httpx>=0.27.0",
    "anyio>=4.4.0",
    "mypy>=1.10.0,<2.0",
    "bandit>=1.7.0,<2.0",
    "pip-audit>=2.7.0,<3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B104"]
