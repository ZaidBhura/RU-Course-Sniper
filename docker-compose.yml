version: "3.9"

# RU Course Sniper — local development stack
# Usage:
#   docker compose up --build -d
#   docker compose exec backend alembic upgrade head
#   curl http://localhost:8000/api/health

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sniper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sniper_dev}
      POSTGRES_DB: course_sniper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sniper -d course_sniper"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    # Disable persistence in dev — fast restart, no stale state
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to point at the compose-networked postgres service
      DATABASE_URL: postgresql+asyncpg://sniper:${POSTGRES_PASSWORD:-sniper_dev}@postgres:5432/course_sniper
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Mount source for hot reload — changes reflected immediately without rebuild
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
