name: Advisor CI

on:
  push:
    branches: [main, advisor-agent]
    paths:
      - "advisor/**"
      - ".github/workflows/advisor-ci.yml"
  pull_request:
    paths:
      - "advisor/**"
      - ".github/workflows/advisor-ci.yml"

defaults:
  run:
    working-directory: advisor

jobs:
  lint:
    name: Lint, types, security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: advisor/pyproject.toml
      - run: pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check advisor tests alembic/env.py
      - run: ruff format --check advisor tests alembic/env.py
      - run: mypy advisor
      - run: bandit -r advisor -ll
      - run: pip-audit

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: advisor
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: advisor_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      ADVISOR_TEST_DATABASE_URL: postgresql+psycopg://advisor:test_password@localhost:5432/advisor_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: advisor/pyproject.toml
      - run: pip install --upgrade pip && pip install -e ".[dev]"
      - run: pytest -v --tb=short
